<!doctype html><html lang="no"><head><meta charset="utf-8"><title>Bingo</title>
<style>
html,body{margin:0;height:100%;background:#1b1240;color:#fff;font-family:system-ui,sans-serif;cursor:none}
#board{display:grid;align-items:center;grid-template-columns:repeat(5,minmax(0,1fr));gap:2vw;padding:6vh 4vw;height:88vh;box-sizing:border-box}
.col{min-width:0;box-sizing:border-box;padding:0 1vw;border-left:3px solid #ffffff33;display:flex;flex-direction:column;align-items:center;gap:3vh}
.let{width:100%;text-align:center;font-size:16vh;font-weight:900;color:#ffcc00;line-height:1}
.num{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(9vw,17vh);font-weight:800;background:#2c2160;border-radius:3vw;transition:.3s}
.num.new{background:#ff4fa3;box-shadow:0 0 6vw #ff4fa3}
.col:first-child{border-left-color:transparent}
.c0 .let{width:100%;text-align:center;color:#3fa9ff}.c1 .let{width:100%;text-align:center;color:#ff4d4d}.c2 .let{width:100%;text-align:center;color:#e8e8e8}.c3 .let{width:100%;text-align:center;color:#3ddc6b}.c4 .let{width:100%;text-align:center;color:#ffa733}
.c0 .num{border:4px solid #3fa9ff}.c1 .num{border:4px solid #ff4d4d}.c2 .num{border:4px solid #e8e8e8}.c3 .num{border:4px solid #3ddc6b}.c4 .num{border:4px solid #ffa733}
.num{box-sizing:border-box;height:auto!important;aspect-ratio:1/1;width:92%!important;max-height:60vh}
#board{align-items:stretch!important}
.old{width:92%;display:flex;flex-wrap:wrap;gap:.8vh .6vw;justify-content:center}
.old span{flex:0 0 calc(33% - .6vw);text-align:center;font-size:min(3vw,5.5vh);font-weight:700;padding:.4vh 0;border-radius:1vw;background:#ffffff14}
.old span:first-child{background:#ffffff2e}
</style></head><body ondblclick="document.documentElement.requestFullscreen()"><div id="lock" style="position:fixed;inset:0;z-index:99;background:#1b1240;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;color:#fff"><div style="font-size:28px;font-weight:800">🔒 Skriv kode</div><input id="pin" type="password" inputmode="numeric" maxlength="8" style="font-size:32px;width:180px;text-align:center;padding:10px;border-radius:12px;border:0"><div id="pinmsg" style="color:#ff6b6b;height:20px"></div></div>
<script>(function(){const ok=()=>{document.getElementById("lock").remove()};if(localStorage.bingoPin==="1337"){ok();return}const p=document.getElementById("pin");p.focus();p.addEventListener("input",()=>{if(p.value==="1337"){localStorage.bingoPin="1337";ok()}else if(p.value.length>=4)pinmsg.textContent="Feil kode"})})()</script>
<div id="board"></div>
<script>
const L="BINGO",lt=v=>L[Math.floor((v-1)/15)];let prev="",lastLen=0,lastT=0,busy=false;
const T=new URLSearchParams(location.search).get("t")||"bingo-015e3e45ed4d";
function apply(m){if(!m||m.event!=="message"||m.time<lastT)return;let h;try{h=JSON.parse(m.message)}catch(e){return}if(!Array.isArray(h)||(m.time==lastT&&h.length<lastLen))return;lastT=m.time;lastLen=h.length;try{localStorage.bingoState=JSON.stringify({time:m.time,message:m.message})}catch(e){}const k=JSON.stringify(h);if(k==prev)return;prev=k;const cur={},last=h.at(-1);[...L].forEach(x=>cur[x]=[]);h.forEach(v=>cur[lt(v)].unshift(v));
[...L].forEach((x,j)=>{let c=document.getElementById("c"+x);if(!c){board.insertAdjacentHTML("beforeend",`<div class="col c${j}" id="c${x}"><div class="let">${x}</div><div class="num"></div><div class="old"></div></div>`);c=document.getElementById("c"+x)}
const n=c.querySelector(".num"),o=c.querySelector(".old"),nv=String(cur[x][0]??""),ov=cur[x].slice(1).map(v=>`<span>${v}</span>`).join("");
if(n.textContent!==nv)n.textContent=nv;n.classList.toggle("new",!!last&&lt(last)==x);if(o.innerHTML!==ov)o.innerHTML=ov})}
async function poll(){if(busy)return;busy=true;try{const r=(await (await fetch(`https://ntfy.sh/${T}/json?poll=1&since=latest`,{cache:"no-store"})).text()).trim();if(r)apply(JSON.parse(r.split("\n").pop()))}catch(e){}busy=false}
board.innerHTML="";apply({event:"message",time:0,message:"[]"});try{const c=JSON.parse(localStorage.bingoState||"null");if(c)apply({event:"message",time:c.time,message:c.message})}catch(e){}poll();
try{const es=new EventSource(`https://ntfy.sh/${T}/sse`);es.onmessage=e=>{try{apply(JSON.parse(e.data))}catch(x){}}}catch(e){}
setInterval(poll,3000);
</script></body></html>
