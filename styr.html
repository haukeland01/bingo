<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo styring</title>
<style>
body{margin:0;padding:16px;background:#1b1240;color:#fff;font-family:system-ui,sans-serif}
.row{display:flex;gap:8px;margin-bottom:12px}
.lb{flex:1;font-size:30px;font-weight:900;padding:14px 0;border:none;border-radius:12px;background:#2c2160;color:#ffcc00}
.lb.on{background:#ffcc00;color:#1b1240}
input{flex:1;font-size:34px;padding:10px;border-radius:12px;border:none;text-align:center;min-width:0}
button{font-size:20px;border:none;border-radius:12px;padding:14px}
.big{background:#ff4fa3;color:#fff;font-weight:800;font-size:24px}
#msg{color:#ff8080;min-height:24px}#cur{display:flex;gap:6px;margin:10px 0}#cur div{flex:1;text-align:center;background:#2c2160;border-radius:10px;padding:8px;font-size:22px}
#log{font-size:18px;line-height:1.7;opacity:.85}
</style></head><body>
<div class="row" id="lets"></div>
<form id="f" class="row"><input id="i" inputmode="numeric" placeholder="36" autocomplete="off"><button class="big">Send</button></form>
<div id="msg"></div>
<div id="cur"></div>
<div class="row"><button style="flex:1" id="undo">Angre</button><button style="flex:1" id="logb">Logg</button><button style="flex:1;background:#ff6b6b" id="reset">Nytt spill</button></div>
<div id="log" hidden></div>
<script>
const L="BINGO",lt=v=>L[Math.floor((v-1)/15)];let sel="",h=[];
lets.innerHTML=[...L].map(x=>`<button type="button" class="lb" data-l="${x}">${x}</button>`).join("");
lets.onclick=e=>{const l=e.target.dataset.l;if(!l)return;sel=sel==l?"":l;[...lets.children].forEach(b=>b.classList.toggle("on",b.dataset.l==sel));i.focus()};
function show(){const c={};h.forEach(v=>c[lt(v)]=v);cur.innerHTML=[...L].map(x=>`<div><b style="color:#ffcc00">${x}</b><br>${c[x]??"–"}</div>`).join("");
log.innerHTML=`<b>${h.length} trukket:</b><br>`+(h.map((v,k)=>`${k+1}. ${lt(v)}${v}`).join(" &nbsp; ")||"Ingen ennå")}
const T=new URLSearchParams(location.search).get("t");
async function load(){try{const r=(await (await fetch(`https://ntfy.sh/${T}/json?poll=1&since=latest`,{cache:"no-store"})).text()).trim();h=r?JSON.parse(JSON.parse(r.split("\n").pop()).message):[]}catch(e){}show()}
async function pub(){try{await fetch(`https://ntfy.sh/${T}`,{method:"POST",body:JSON.stringify(h)});msg.textContent=""}catch(e){msg.textContent="Fikk ikke sendt, sjekk nettet"}show()}
async function post(p,b){if(p=="/add"){const t=b.v.replace(/[\s-]/g,"");const m=t.match(/^([BINGO])?(\d{1,2})$/);if(!m){msg.textContent="Skriv f.eks. N36";return}const v=+m[2];if(v<1||v>75){msg.textContent="Tallet må være 1–75";return}if(m[1]&&m[1]!=lt(v)){msg.textContent=`${v} hører til ${lt(v)}, ikke ${m[1]}`;return}h.push(v)}else if(p=="/undo")h.pop();else h=[];await pub()}
f.onsubmit=async e=>{e.preventDefault();let t=i.value.trim().toUpperCase();if(!t)return;if(sel&&!/^[BINGO]/.test(t))t=sel+t;await post("/add",{v:t});if(!msg.textContent)i.value="";i.focus()};
undo.onclick=()=>post("/undo");
reset.onclick=()=>confirm("Starte nytt spill?")&&post("/reset");
logb.onclick=()=>log.hidden=!log.hidden;
load();
</script></body></html>
